<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8fbfb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Jest — Life Tracker</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css?v=1.5.0" />
  <link rel="stylesheet" href="mood-fixes.css?v=1.5.0" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand-image-wrap" aria-label="Jest — Track · Balance · A Happier You">
        <div class="brand-image" aria-hidden="true">
          <span class="brand-word">Jest</span><span class="brand-heart">♡</span>
          <span class="brand-tagline">TRACK · BALANCE · A HAPPIER YOU</span>
        </div>
        <small class="app-version">v1.5.0</small>
      </div>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings">⚙︎</button>
    </header>

    <main id="main"></main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button data-route="home" class="nav-btn active"><span>⌂</span><small>Home</small></button>
      <button data-route="spending" class="nav-btn"><span>▣</span><small>Spending</small></button>
      <button id="quickAdd" class="nav-btn add-btn" aria-label="Add entry"><span>＋</span></button>
      <button data-route="insights" class="nav-btn"><span>▥</span><small>Insights</small></button>
      <button data-route="more" class="nav-btn"><span>☰</span><small>More</small></button>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <script src="core.js?v=1.5.0"></script>
  <script src="spending.js"></script>
  <script src="sleep.js"></script>
  <script src="period-water.js"></script>
  <script src="insights.js"></script>
  <script src="modals.js"></script>
  <script src="bootstrap.js"></script>
</body>
</html>
