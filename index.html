<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8fbfb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Jest — Life Tracker</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css?v=1.9.5" />
  <link rel="stylesheet" href="mood-fixes.css?v=1.9.5" />
  <link rel="stylesheet" href="header-approved.css?v=1.9.5" />
  <link rel="stylesheet" href="home-visual-prep.css?v=1.9.5" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar approved-topbar">
      <div class="approved-brand-wrap" aria-label="Jest — an overview">
        <img class="approved-brand-image" src="assets/jest-header-approved.webp?v=1.9.5" alt="Jest — an overview" />
        <small class="app-version" aria-label="App version 1.9.5">v1.9.5</small>
      </div>
      <button class="icon-btn header-settings-btn" id="settingsBtn" aria-label="Settings"><img class="header-settings-art" src="assets/settings-gear.webp?v=1.9.5" alt="" aria-hidden="true" /></button>
    </header>

    <main id="main"></main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button data-route="home" class="nav-btn active"><img src="assets/nav-home.svg?v=1.9.5" alt="" aria-hidden="true" style="width:45px;height:45px;display:block;object-fit:contain"><small>Home</small></button>
      <button data-route="spending" class="nav-btn"><img src="assets/nav-spending.svg?v=1.9.5" alt="" aria-hidden="true" style="width:45px;height:45px;display:block;object-fit:contain"><small>Shopping</small></button>
      <button id="quickAdd" class="nav-btn add-btn" aria-label="Add entry" style="width:55px;height:55px"><span>＋</span></button>
      <button data-route="insights" class="nav-btn"><img src="assets/nav-insights.svg?v=1.9.5" alt="" aria-hidden="true" style="width:45px;height:45px;display:block;object-fit:contain"><small>Insights</small></button>
      <button data-route="more" class="nav-btn"><img src="assets/nav-more.svg?v=1.9.5" alt="" aria-hidden="true" style="width:45px;height:45px;display:block;object-fit:contain"><small>More</small></button>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <script src="core.js?v=1.9.5"></script>
  <script src="spending.js?v=1.9.5"></script>
  <script src="sleep.js?v=1.9.5"></script>
  <script src="period-water.js?v=1.9.5"></script>
  <script src="insights.js?v=1.9.5"></script>
  <script src="modals.js?v=1.9.5"></script>
  <script src="meals.js?v=1.9.5"></script>
  <script src="bootstrap.js?v=1.9.5"></script>
