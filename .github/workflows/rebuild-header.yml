name: Publish approved header artwork

on:
  push:
    paths:
      - '.github/workflows/rebuild-header.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and validate approved header
        shell: bash
        run: |
          set -euo pipefail
          cat assets/header-chunk-*.txt | tr -d '\n\r' | base64 --decode > assets/jest-header-approved.webp
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/jest-header-approved.webp')
          b=p.read_bytes()
          if len(b) != 34316:
              raise SystemExit(f'Unexpected header size: {len(b)}')
          if not (b[:4] == b'RIFF' and b[8:12] == b'WEBP'):
              raise SystemExit('Approved header is not a valid WebP container')
          print('Validated approved header:', len(b), 'bytes')
          PY

          rm -f assets/jest-header-approved-v1.7.webp
          rm -f assets/header-chunk-*.txt

          python3 - <<'PY'
          from pathlib import Path

          index=Path('index.html').read_text()
          index=index.replace('1.8.0','1.8.1')
          index=index.replace('assets/jest-header-approved-v1.7.webp?v=1.8.1','assets/jest-header-approved.webp?v=1.8.1')
          if 'assets/jest-header-approved.webp?v=1.8.1' not in index:
              raise SystemExit('Header path update failed')
          if 'v1.8.1' not in index:
              raise SystemExit('Version bump failed')
          Path('index.html').write_text(index)

          css='''.approved-topbar{position:sticky;top:0;z-index:20;display:block;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid #eef3f6}.approved-brand-wrap{position:relative;width:100%;min-width:0}.approved-brand-image{display:block;width:100%;height:auto;aspect-ratio:1290/484;object-fit:cover;object-position:center;border-radius:20px}.approved-brand-wrap .app-version{position:absolute;right:52px;bottom:9px;z-index:5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:8px;font-weight:500;letter-spacing:.35px;color:#5f5a86;opacity:.78;background:rgba(255,255,255,.72);padding:3px 6px;border-radius:7px;line-height:1;box-shadow:0 1px 6px rgba(62,54,110,.08)}.approved-topbar .header-settings-btn{position:absolute;right:18px;top:calc(50% + (env(safe-area-inset-top)/2));transform:translateY(-50%);z-index:6;width:36px;height:36px;display:flex;align-items:center;justify-content:center;margin:0;border-radius:50%;background:rgba(255,255,255,.78);box-shadow:0 2px 12px rgba(62,54,110,.14);font-size:20px}.approved-topbar .header-settings-btn:active{background:rgba(255,255,255,.94)}@media(max-width:390px){.approved-topbar{padding-left:8px;padding-right:8px}.approved-brand-image{border-radius:18px}.approved-brand-wrap .app-version{right:48px;bottom:8px;font-size:7px}.approved-topbar .header-settings-btn{right:14px;width:34px;height:34px;font-size:19px}}\n'''
          Path('header-approved.css').write_text(css)

          # Production sanity checks.
          if Path('assets/jest-header-approved-v1.7.webp').exists():
              raise SystemExit('Legacy header asset still exists')
          if list(Path('assets').glob('header-chunk-*.txt')):
              raise SystemExit('Header staging chunks still exist')
          if 'jest-header-approved-v1.7.webp' in Path('index.html').read_text():
              raise SystemExit('Legacy header reference remains')
          PY

          rm -f .github/workflows/rebuild-header.yml

      - name: Publish header v1.8.1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Jest App Builder"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Replace header with approved artwork v1.8.1"
          git push origin HEAD:main

# trigger: approved-header-v1.8.1
