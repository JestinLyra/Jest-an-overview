name: Diagnose approved header chunks

on:
  push:
    paths:
      - '.github/workflows/rebuild-header.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify staged header chunks
        shell: bash
        run: |
          set -euo pipefail
          echo 'Expected lengths: 6000 6000 6000 6000 6000 6000 6000 3756'
          for f in assets/header-chunk-*.txt; do wc -c "$f"; sha256sum "$f"; done
          echo 'Expected SHA256:'
          echo 'bdcf50db99c0e038b080ba813f585c57ec11a1d7f163db61d8ee7a74958dbb50  assets/header-chunk-01.txt'
          echo '5a03ce87c3c965561e78ebe22ba33bbe8dc0ad341567f83765577c90d52c2b85  assets/header-chunk-02.txt'
          echo 'ce60dc622ad422838a7ba60e6ee332e23b36325de8d07058552273f446552a55  assets/header-chunk-03.txt'
          echo 'f96cfc82d6ccccff7cc84a5690a5cdff9642b5fcfe0dcd66aab6e26209f703fa  assets/header-chunk-04.txt'
          echo '7e5bfaf82d420977d7630273af7f3aab1823b27b47ef0b11c0c7a7bf98b4d721  assets/header-chunk-05.txt'
          echo '2371fb340b6078d270fa5f9f3959aa9ee01aa182814af70c0e8b8cc42db7d26b  assets/header-chunk-06.txt'
          echo '5dedecf071ef11a51950ada574341dac9d78733c273fcda1eefa46806f44bc51  assets/header-chunk-07.txt'
          echo 'fc3d88b8b4bfe81d7c31565e4d1af796921c665ef3b3147f3b6127ebc88c19cf  assets/header-chunk-08.txt'

# trigger diagnostics
