<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 360" role="img" aria-labelledby="title desc">
  <title id="title">Meals, Wellness Check and Active Days</title>
  <desc id="desc">Three-part glossy tracker switcher matching the primary Home switcher layout.</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset="0.55" stop-color="#f4f8fd"/>
      <stop offset="1" stop-color="#eaf2fa"/>
    </linearGradient>
    <linearGradient id="meal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#83ebd0"/>
      <stop offset="1" stop-color="#36ae94"/>
    </linearGradient>
    <linearGradient id="wellness" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9c9ff"/>
      <stop offset="1" stop-color="#9f84e8"/>
    </linearGradient>
    <linearGradient id="active" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8cebd3"/>
      <stop offset="1" stop-color="#45bfa3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#7f95ab" flood-opacity="0.20"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="24" y="34" width="1552" height="292" rx="72" fill="url(#bar)" stroke="#dce7f3" stroke-width="5"/>
    <rect x="38" y="47" width="1524" height="264" rx="61" fill="none" stroke="#ffffff" stroke-opacity="0.78" stroke-width="4"/>
    <path d="M533 68V292M1067 68V292" stroke="#dce7f3" stroke-width="4"/>
  </g>

  <g>
    <circle cx="135" cy="180" r="68" fill="url(#meal)"/>
    <g fill="#fff">
      <rect x="105" y="145" width="12" height="78" rx="6"/>
      <rect x="90" y="122" width="10" height="42" rx="5"/>
      <rect x="106" y="122" width="10" height="42" rx="5"/>
      <rect x="122" y="122" width="10" height="42" rx="5"/>
      <path d="M95 154c0 17 10 27 17 27s17-10 17-27h-10c0 9-3 14-7 14s-7-5-7-14z"/>
      <path d="M153 121c16 0 24 12 24 33v69c0 6-5 11-11 11s-11-5-11-11v-48c-9-3-14-10-14-20 0-16 5-34 12-34z"/>
    </g>
    <text x="230" y="202" fill="#173c70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="62" font-weight="700">Meals</text>
  </g>

  <g>
    <circle cx="665" cy="180" r="68" fill="url(#wellness)"/>
    <path d="M665 137v86M622 180h86" stroke="#fff" stroke-width="20" stroke-linecap="round"/>
    <text x="755" y="171" fill="#173c70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="46" font-weight="700">Wellness</text>
    <text x="755" y="220" fill="#173c70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="46" font-weight="700">Check</text>
  </g>

  <g>
    <circle cx="1195" cy="180" r="68" fill="url(#active)"/>
    <path d="M1164 211l28-42 23 18 37-52" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1164" cy="211" r="8" fill="#fff"/>
    <circle cx="1192" cy="169" r="8" fill="#fff"/>
    <circle cx="1215" cy="187" r="8" fill="#fff"/>
    <circle cx="1252" cy="135" r="8" fill="#fff"/>
    <text x="1290" y="171" fill="#173c70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="46" font-weight="700">Active</text>
    <text x="1290" y="220" fill="#173c70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="46" font-weight="700">Days</text>
  </g>
</svg>